<!doctype html>
<!-- High-quality image upscaler (Lanczos-3 + gentle unsharp mask), run in headless Edge/Chrome by scripts/upscale.mjs.
     Usage: /scripts/upscale.html?src=/assets/illustrations/hero-source.jpg&scale=3  -->
<meta charset="utf-8"><title>Upscale</title>
<body><script>
(async () => {
  const q = new URLSearchParams(location.search);
  const scale = Number(q.get('scale')) || 3;
  const img = new Image();
  img.src = q.get('src');
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight, W = Math.round(w * scale), H = Math.round(h * scale);
  const c0 = document.createElement('canvas'); c0.width = w; c0.height = h;
  const x0 = c0.getContext('2d'); x0.drawImage(img, 0, 0);
  const src = x0.getImageData(0, 0, w, h).data;

  // ---- Lanczos-3, separable ----
  const A = 3;
  const L = (x) => { if (x === 0) return 1; if (Math.abs(x) >= A) return 0; const p = Math.PI * x; return (A * Math.sin(p) * Math.sin(p / A)) / (p * p); };
  const taps = (n, N) => Array.from({ length: N }, (_, i) => {
    const c = (i + 0.5) * (n / N) - 0.5, left = Math.floor(c) - A + 1;
    const ws = []; let sum = 0;
    for (let j = left; j < left + 2 * A; j++) { const v = L(c - j); ws.push([Math.min(n - 1, Math.max(0, j)), v]); sum += v; }
    ws.forEach((p) => { p[1] /= sum; });
    return ws;
  });
  const tx = taps(w, W), ty = taps(h, H);
  const mid = new Float32Array(h * W * 3);
  for (let y = 0; y < h; y++) for (let X = 0; X < W; X++) {
    let r = 0, g = 0, b = 0;
    for (const [j, v] of tx[X]) { const k = (y * w + j) * 4; r += src[k] * v; g += src[k + 1] * v; b += src[k + 2] * v; }
    const t = (y * W + X) * 3; mid[t] = r; mid[t + 1] = g; mid[t + 2] = b;
  }
  const up = new Float32Array(H * W * 3);
  for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) {
    let r = 0, g = 0, b = 0;
    for (const [j, v] of ty[Y]) { const k = (j * W + X) * 3; r += mid[k] * v; g += mid[k + 1] * v; b += mid[k + 2] * v; }
    const t = (Y * W + X) * 3; up[t] = r; up[t + 1] = g; up[t + 2] = b;
  }

  // ---- unsharp mask (gaussian sigma ~1.6px at output size), with a threshold so JPEG noise isn't amplified ----
  const sigma = 1.6 * scale / 3, rad = Math.ceil(sigma * 3);
  const k = Array.from({ length: rad * 2 + 1 }, (_, i) => Math.exp(-((i - rad) ** 2) / (2 * sigma * sigma)));
  const ks = k.reduce((a, b) => a + b, 0); for (let i = 0; i < k.length; i++) k[i] /= ks;
  const blurH = new Float32Array(up.length), blur = new Float32Array(up.length);
  for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) for (let ch = 0; ch < 3; ch++) {
    let s = 0; for (let i = -rad; i <= rad; i++) { const xx = Math.min(W - 1, Math.max(0, X + i)); s += up[(Y * W + xx) * 3 + ch] * k[i + rad]; }
    blurH[(Y * W + X) * 3 + ch] = s;
  }
  for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) for (let ch = 0; ch < 3; ch++) {
    let s = 0; for (let i = -rad; i <= rad; i++) { const yy = Math.min(H - 1, Math.max(0, Y + i)); s += blurH[(yy * W + X) * 3 + ch] * k[i + rad]; }
    blur[(Y * W + X) * 3 + ch] = s;
  }
  const amount = 0.6, threshold = 3;
  const out = new ImageData(W, H);
  for (let p = 0, q2 = 0; p < up.length; p += 3, q2 += 4) {
    for (let ch = 0; ch < 3; ch++) {
      const d = up[p + ch] - blur[p + ch];
      out.data[q2 + ch] = Math.max(0, Math.min(255, up[p + ch] + (Math.abs(d) > threshold ? d * amount : 0)));
    }
    out.data[q2 + 3] = 255;
  }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').putImageData(out, 0, 0);
  document.body.innerHTML = '<pre id="out">' + c.toDataURL('image/jpeg', 0.9) + '</pre>';
})();
</script></body>
